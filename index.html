<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUSI EDP ITEM TRACKER</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            overflow: hidden;
            border-top: 6px solid #ffcc00;
        }

        .header {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .header p {
            font-size: 11px;
            color: #aaaaaa;
            margin-top: 5px;
            text-transform: uppercase;
        }

        form {
            padding: 25px 20px;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffcc00;
            margin-bottom: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #ffcc00;
            background-color: #333333;
        }

        input::placeholder {
            color: #666666;
            font-size: 12px;
        }

        .input-error-msg {
            color: #ff4444;
            font-size: 11px;
            margin-top: 4px;
            display: none;
        }

        input.invalid-input {
            border-color: #ff4444 !important;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #ffcc00;
            border: none;
            border-radius: 6px;
            color: #000000;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #e6b800;
        }

        .btn-submit:disabled {
            background-color: #555555;
            color: #888888;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .success { background-color: #1b5e20; color: #c8e6c9; }
        .error { background-color: #b71c1c; color: #ffcdd2; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>RUSI EDP ITEM TRACKER</h1>
            <p>Scan & Submit Asset Log Details</p>
        </div>

        <form id="logForm" novalidate>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" placeholder="e.g., San Manuel Isabela" required>
            </div>

            <div class="form-group">
                <label for="idNumber">ID Number</label>
                <!-- BINAGO ANG PLACEHOLDER: Numero na lang ang hihingin natin sa rider -->
                <input type="text" id="idNumber" placeholder="e.g., 101" required>
                <div class="input-error-msg" id="idError">Maling input. Mangyaring maglagay ng valid na numero para sa ID.</div>
            </div>

            <div class="form-group">
                <label for="receivedBy">Received By (Name)</label>
                <input type="text" id="receivedBy" placeholder="e.g., Juan Dela Cruz" required>
            </div>

            <div class="form-group">
                <label for="contactNumber">Contact Number</label>
                <input type="text" id="contactNumber" placeholder="e.g., 09123456789" maxlength="11" required>
                <div class="input-error-msg" id="contactError">Dapat eksaktong 11 digits at nagsisimula sa 09 (e.g., 09123456789).</div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Submit Log</button>
            <div id="message"></div>
        </form>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwNe3hDh1JT2SyhCOQajt1A0coaDxxFqaZp1qcwOWRQUDhxRGaxilSA_UqWzm8GqEe3CA/exec";

        document.getElementById('logForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const idInput = document.getElementById('idNumber');
            const contactInput = document.getElementById('contactNumber');
            const idError = document.getElementById('idError');
            const contactError = document.getElementById('contactError');
            
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            
            idInput.classList.remove('invalid-input');
            contactInput.classList.remove('invalid-input');
            idError.style.display = "none";
            contactError.style.display = "none";
            messageDiv.style.display = "none";
            
            let hasError = false;

            // 1. VALIDATION PARA SA ID NUMBER (Tinitiyak na may nilagay na kahit anong numero o text)
            let idValue = idInput.value.trim();
            if (idValue.length === 0) {
                idInput.classList.add('invalid-input');
                idError.style.display = "block";
                hasError = true;
            }

            // 2. VALIDATION PARA SA CONTACT NUMBER (11 digits starting with 09)
            const contactValue = contactInput.value.trim();
            const contactPattern = /^09\d{9}$/; 
            if (!contactPattern.test(contactValue)) {
                contactInput.classList.add('invalid-input');
                contactError.style.display = "block";
                hasError = true;
            }

            if (hasError) {
                return;
            }
            
            // AUTOMATIC APPEND LOGIC: 
            // Kung hindi pa nagsisimula sa "ID#" ang tinype ng rider, kusa itong idudugtong ng system!
            if (!idValue.toUpperCase().startsWith("ID#")) {
                idValue = "ID#" + idValue;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            const payload = {
                location: document.getElementById('location').value,
                idNumber: idValue, // Ito na yung may awtomatikong "ID#" sa unahan
                receivedBy: document.getElementById('receivedBy').value,
                contactNumber: contactValue
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                messageDiv.className = "success";
                messageDiv.innerText = "Log submitted successfully to Tracker v2!";
                messageDiv.style.display = "block";
                document.getElementById('logForm').reset();
            })
            .catch(error => {
                messageDiv.className = "error";
                messageDiv.innerText = "Error: " + error.message;
                messageDiv.style.display = "block";
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Log";
            });
        });
    </script>
</body>
</html>
